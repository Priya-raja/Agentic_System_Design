services:
   vector-db:
     image: qdrant/qdrant:latest
     container_name: aeronova-qdrant
     ports:
        - "6333:6333"
        - "6334:6334"
     volumes:
          - qdrant_data:/qdrant/storage
     restart: unless-stopped


   phoenix:
      image: arizephoenix/phoenix:latest
      ports:
         - "6006:6006"
         - "4317:4317"
      environment:
         PHOENIX_WORKING_DIR: /data
      volumes:
         - phoenix_data:/data

   redis:
    image: redis:7-alpine
    container_name: aeronova-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  qdrant_data:
  phoenix_data:
  redis_data:
