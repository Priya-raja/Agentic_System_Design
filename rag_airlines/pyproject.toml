[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aeronova-agent"
version = "0.2.0"
requires-python = ">=3.11,<3.14"
description = "Bounded, verified tool-calling agent for a fictional airline"
dependencies = [
 "python-dotenv>=1,<2", "pydantic>=2.9,<3", "httpx>=0.27,<1",
 "langgraph>=0.6.11,<0.7", "langgraph-checkpoint-sqlite>=2.0.11,<3",
 "langchain-openai>=0.3.35,<0.4", "langchain-core>=0.3.79,<0.4",
 "langchain-community==0.3.31", "langchain-text-splitters>=0.3,<0.4",
 "langchain-qdrant>=0.2,<0.3", "qdrant-client>=1.18,<1.19",
 "rank-bm25==0.2.2", "pymupdf>=1.24,<2", "pillow>=11,<13", "pytesseract>=0.3,<0.4",
 "redis>=5,<7", "opentelemetry-api>=1.29,<1.45",
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "slowapi==0.1.9", "reportlab>=4,<6"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2", "types-redis", "types-requests"]
eval = ["ragas==0.4.3"]
tracing = ["arize-phoenix-otel", "openinference-instrumentation-langchain", "openinference-instrumentation-openai", "opentelemetry-exporter-otlp<1.45"]
[tool.setuptools.packages.find]
include = ["agent*", "context*", "safety*", "observability*", "backend*", "evals*"]
[tool.setuptools]
py-modules = ["config"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires external services and API keys"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
